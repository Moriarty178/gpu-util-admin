# Phần chung của site (dùng cho cả chế độ HTTP và HTTPS): phục vụ frontend/dist + proxy /api → api:8000.
root /usr/share/nginx/html;
server_tokens off;

client_max_body_size 25m;   # upload ≤ 20 MB (app_setting max_upload_mb) + phần đầu multipart

include /etc/nginx/gpu/headers.conf;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    # IP người dùng: $remote_addr (đã qua realip.conf nếu có proxy tin cậy phía trước). GHI ĐÈ, không nối thêm
    # X-Forwarded-For của trình duyệt — api (uvicorn --forwarded-allow-ips *) lấy IP đầu danh sách → nối thêm = giả được IP.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;     # nhập file lớn / xuất Excel / dựng pptx
    proxy_request_buffering off;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/gpu/headers.conf;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/gpu/headers.conf;
    try_files $uri /index.html;  # route của React Router
}
