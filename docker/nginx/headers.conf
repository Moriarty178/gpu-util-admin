# Header bảo mật — include ở mức server VÀ trong mọi location có add_header riêng (nginx không kế thừa add_header khi
# location tự khai báo). Không tải tài nguyên ngoài: CSP chỉ 'self'. AntD (CSS-in-JS) chèn <style> → style cần 'unsafe-inline'.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Chế độ HTTPS: 40-gpu-mode.sh ghi HSTS vào file này (chế độ HTTP: file rỗng)
include /etc/nginx/gpu/tls-headers.conf;
