# Chế độ HTTPS (compose.tls.yaml): nginx giữ chứng chỉ .pem của TTCN; cổng 80 chỉ chuyển hướng sang HTTPS.
# __HTTPS_PORT_SUFFIX__ do 40-gpu-mode.sh thay (rỗng khi cổng công khai là 443, ngược lại ":<cổng>").
include /etc/nginx/gpu/realip.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;
    location / {
        return 301 https://$host__HTTPS_PORT_SUFFIX__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;   # chứng chỉ + chuỗi trung gian (fullchain)
    ssl_certificate_key /etc/nginx/tls/key.pem;    # khóa riêng, KHÔNG đặt passphrase
    # Cấu hình "intermediate" (Mozilla): TLS 1.2 + 1.3, bộ mã AEAD
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GPU_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/gpu/app.conf;
}
