# Chế độ HTTP (mặc định): nghe cổng 80 trong container; compose chỉ mở ra ${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}.
# Dùng khi truy cập qua đường hầm SSH, hoặc khi proxy TLS của hạ tầng đứng phía trước (COOKIE_SECURE=true, DEPLOY.md §8).
include /etc/nginx/gpu/realip.conf;

server {
    listen 80;
    server_name _;
    include /etc/nginx/gpu/app.conf;
}
